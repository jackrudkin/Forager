name: Release

# Bump "## Version:" in Forager.toc and push to main: if tag v<version> doesn't
# exist yet, this tags the commit, builds the zip and uploads it to CurseForge
# (needs the CF_API_KEY secret + X-Curse-Project-ID in the .toc) and GitHub Releases.
# Pushes that don't change the version publish nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}   # missing secret = CurseForge upload skipped
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag new version
        id: tag
        run: |
          v=$(grep -m1 '^## Version:' Forager.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r[:space:]')
          if [ -z "$v" ]; then echo "No version in Forager.toc"; exit 1; fi
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v already released; nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            git tag "v$v"
            git push origin "v$v"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=v$v" >> "$GITHUB_OUTPUT"
          fi

      # The packager action refuses to build on a branch push when a tag points at HEAD
      # ("Found future tag ..., not packaging"), because it expects the tag push to start a
      # second run. Tags pushed by this workflow don't start runs, so run the packager's
      # script directly and tell it this is a tag build.
      - name: Package and upload
        if: steps.tag.outputs.release == 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh -o "$RUNNER_TEMP/release.sh"
          GITHUB_REF="refs/tags/${{ steps.tag.outputs.tag }}" GITHUB_REF_NAME="${{ steps.tag.outputs.tag }}" \
            bash "$RUNNER_TEMP/release.sh"
